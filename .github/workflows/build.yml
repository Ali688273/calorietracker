name: Build Android APK with 20k Foods

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # تولید کامل فایل ۲۰ هزار غذا
    - name: Generate 20,000 Foods Database
      run: node generate_foods.js

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # تنظیم دقیق نسخه Gradle به 8.5 جهت جلوگیری از باگ نسخه 9.7
    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    # ساخت فایل gradlew سازگار
    - name: Ensure gradlew exists
      run: |
        gradle wrapper --gradle-version 8.5
        chmod +x gradlew

    # ساخت کی‌استور موقت
    - name: Generate Temporary Keystore
      run: |
        keytool -genkey -v -keystore app/release.keystore \
          -alias key0 -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass android -keypass android \
          -dname "CN=CalorieTracker, OU=Dev, O=App, L=City, S=State, C=US"

    - name: Build with Gradle
      run: ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Signed-CalorieTracker-20k-APK
        path: app/build/outputs/apk/release/*.apk
