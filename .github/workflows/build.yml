name: Build Android APK with 20k Foods

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    # تولید کامل فایل ۲۰ هزار غذا برای برنامه
    - name: Generate 20,000 Foods Database
      run: node generate_foods.js

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # ساخت فایل gradlew در صورت عدم وجود
    - name: Ensure gradlew exists
      run: |
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    # ساخت کی‌استور موقت جهت رفع ارور validateSigningRelease
    - name: Generate Temporary Keystore
      run: |
        keytool -genkey -v -keystore app/release.keystore \
          -alias key0 -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass android -keypass android \
          -dname "CN=CalorieTracker, OU=Dev, O=App, L=City, S=State, C=US"

    - name: Build with Gradle
      run: ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Signed-CalorieTracker-20k-APK
        path: app/build/outputs/apk/release/*.apk
