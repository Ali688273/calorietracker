name: Build Android APK with 20k Foods

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Generate 20,000 Foods Database
      run: node generate_foods.js

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # ایجاد خودکار فایل gradle.properties برای حل خطای AndroidX
    - name: Configure AndroidX Properties
      run: |
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties

    # ساخت فایل gradlew در صورت عدم وجود و اعطای دسترسی اجرایی
    - name: Ensure gradlew exists
      run: |
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Signed-CalorieTracker-20k-APK
        path: app/build/outputs/apk/release/*.apk
