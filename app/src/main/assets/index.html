<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کالری‌شمار هوشمند</title>
    <style>
        :root {
            --primary: #4CAF50;
            --primary-dark: #388E3C;
            --accent: #FF9800;
            --bg: #F4F6F8;
            --card: #FFFFFF;
            --text: #333333;
            --muted: #777777;
            --danger: #F44336;
        }
        * { box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; }
        body { background-color: var(--bg); color: var(--text); margin: 0; padding: 0; padding-bottom: 70px; }
        .header { background: var(--primary); color: white; padding: 15px; text-align: center; font-weight: bold; font-size: 18px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .container { padding: 15px; max-width: 500px; margin: 0 auto; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card { background: var(--card); border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .card-title { font-weight: bold; margin-bottom: 10px; color: var(--primary-dark); font-size: 16px; border-bottom: 2px solid #f0f0f0; padding-bottom: 5px; }
        .progress-container { background: #e0e0e0; border-radius: 10px; height: 15px; width: 100%; overflow: hidden; margin: 10px 0; }
        .progress-bar { background: var(--primary); height: 100%; width: 0%; transition: width 0.3s ease; }
        .search-box { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; margin-bottom: 10px; }
        .search-box:focus { border-color: var(--primary); }
        .categories { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 10px; }
        .cat-btn { background: #e0e0e0; border: none; padding: 6px 12px; border-radius: 20px; font-size: 12px; white-space: nowrap; cursor: pointer; }
        .cat-btn.active { background: var(--primary); color: white; }
        .food-list { display: flex; flex-direction: column; gap: 8px; max-height: 400px; overflow-y: auto; }
        .food-item { background: #fafafa; border: 1px solid #eee; padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .food-info h4 { margin: 0 0 4px 0; font-size: 14px; }
        .food-info p { margin: 0; font-size: 11px; color: var(--muted); }
        .btn { background: var(--primary); color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; }
        .btn-danger { background: var(--danger); }
        .input-group { margin-bottom: 10px; }
        .input-group label { display: block; font-size: 12px; margin-bottom: 4px; color: var(--muted); }
        .input-group input, .input-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .navbar { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #ddd; box-shadow: 0 -2px 5px rgba(0,0,0,0.05); }
        .nav-item { border: none; background: none; font-size: 12px; color: var(--muted); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .nav-item.active { color: var(--primary); font-weight: bold; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .stat-box { background: #f9f9f9; padding: 10px; border-radius: 8px; text-align: center; }
        .stat-box .val { font-size: 18px; font-weight: bold; color: var(--primary-dark); }
        .stat-box .lbl { font-size: 11px; color: var(--muted); }
    </style>
</head>
<body>
    <div class="header">کالری‌شمار هوشمند</div>

    <div class="container">
        <!-- تب امروز -->
        <div id="tab-today" class="tab-content active">
            <div class="card">
                <div class="card-title">خلاصه وضعیت امروز</div>
                <div class="stat-grid">
                    <div class="stat-box"><div class="val" id="targetCal">2000</div><div class="lbl">هدف روزانه (کالری)</div></div>
                    <div class="stat-box"><div class="val" id="consumedCal">0</div><div class="lbl">دریافتی امروز</div></div>
                </div>
                <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px;">
                    <span>میزان پیشرفت</span>
                    <span id="remainCal">2000 کالری باقی‌مانده</span>
                </div>
                <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
            </div>

            <div class="card">
                <div class="card-title">لیست خوراکی‌های امروز</div>
                <div id="todayList" class="food-list">
                    <p style="text-align:center; color:#888; font-size:12px;">هنوز چیزی ثبت نکرده‌اید.</p>
                </div>
            </div>
        </div>

        <!-- تب ثبت غذا -->
        <div id="tab-foods" class="tab-content">
            <div class="card">
                <div class="card-title">جستجو و ثبت خوراکی</div>
                <input type="text" id="searchInput" class="search-box" placeholder="🔍 جستجوی بین ۲۰,۰۰۰ غذا، میوه، نان...">
                <div class="categories">
                    <button class="cat-btn active" onclick="filterCategory('همه')">همه</button>
                    <button class="cat-btn" onclick="filterCategory('میوه‌ها')">میوه‌ها</button>
                    <button class="cat-btn" onclick="filterCategory('غذاهای ایرانی')">غذاهای ایرانی</button>
                    <button class="cat-btn" onclick="filterCategory('نان و غلات')">نان و غلات</button>
                    <button class="cat-btn" onclick="filterCategory('لبنیات')">لبنیات</button>
                    <button class="cat-btn" onclick="filterCategory('پروتئین‌ها')">پروتئین‌ها</button>
                    <button class="cat-btn" onclick="filterCategory('فست فود')">فست فود</button>
                </div>
                <div id="foodList" class="food-list"></div>
            </div>
        </div>

        <!-- تب پروفایل -->
        <div id="tab-profile" class="tab-content">
            <div class="card">
                <div class="card-title">مشخصات و اهداف شخص</div>
                <div class="input-group">
                    <label>جنسیت</label>
                    <select id="gender"><option value="male">مرد</option><option value="female">زن</option></select>
                </div>
                <div class="input-group"><label>سن (سال)</label><input type="number" id="age" value="25"></div>
                <div class="input-group"><label>قد (سانتی‌متر)</label><input type="number" id="height" value="175"></div>
                <div class="input-group"><label>وزن (کیلوگرم)</label><input type="number" id="weight" value="70"></div>
                <div class="input-group">
                    <label>هدف وزنی</label>
                    <select id="goal">
                        <option value="maintain">تثبیت وزن</option>
                        <option value="lose">کاهش وزن (چربی‌سوزی)</option>
                        <option value="gain">افزایش وزن (عضله‌سازی)</option>
                    </select>
                </div>
                <button class="btn" style="width:100%;" onclick="saveProfile()">محاسبه و ذخیره هدف</button>
            </div>
        </div>
    </div>

    <!-- منوی پایین -->
    <div class="navbar">
        <button class="nav-item active" onclick="switchTab('today', this)">🏠 امروز</button>
        <button class="nav-item" onclick="switchTab('foods', this)">🍎 ثبت غذا</button>
        <button class="nav-item" onclick="switchTab('profile', this)">👤 پروفایل</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
