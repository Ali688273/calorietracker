<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>کالری‌شمار هوشمند</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 75px; direction: rtl; }

        header { padding: 16px; background: #1e293b; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--card-border); }
        .header-title h1 { font-size: 1.1rem; }
        .header-title span { font-size: 0.8rem; color: var(--text-sub); }
        .app-icon { width: 38px; height: 38px; background: #064e3b; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; border: 1px solid var(--accent-green); }

        .container { padding: 16px; }
        .card { background: var(--card-bg); border-radius: 16px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--card-border); }

        .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; text-align: center; }
        .summary-box { background: #0f172a; padding: 12px 8px; border-radius: 12px; }
        .summary-box .val { font-size: 1.1rem; font-weight: bold; color: var(--accent-green); }
        .summary-box .val.burned { color: var(--accent-red); }
        .summary-box .lbl { font-size: 0.75rem; color: var(--text-sub); margin-top: 4px; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .search-box { width: 100%; padding: 12px; background: #0f172a; border: 1px solid var(--card-border); border-radius: 10px; color: #fff; margin-bottom: 12px; font-size: 0.9rem; outline: none; }
        .item-card { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #0f172a; border-radius: 12px; margin-bottom: 8px; border: 1px solid var(--card-border); cursor: pointer; }
        .item-card:active { background: #1e293b; }
        .item-info .name { font-weight: bold; font-size: 0.95rem; }
        .item-info .details { font-size: 0.75rem; color: var(--text-sub); margin-top: 2px; }
        .item-value { color: var(--accent-green); font-weight: bold; font-size: 0.9rem; }
        .item-value.burn { color: var(--accent-red); }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: #1e293b; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--card-border); }
        .nav-item { text-align: center; color: var(--text-sub); font-size: 0.75rem; cursor: pointer; flex: 1; }
        .nav-item.active { color: var(--accent-green); }
        .nav-item .icon { font-size: 1.2rem; display: block; }
        
        .btn-submit { width: 100%; padding: 12px; background: var(--accent-green); border: none; border-radius: 10px; color: #000; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .input-group { margin-bottom: 10px; }
        .input-group label { display: block; font-size: 0.8rem; color: var(--text-sub); margin-bottom: 4px; }
        .input-group input, .input-group select { width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--card-border); border-radius: 8px; color: #fff; }

        /* Modal Overlay */
        .modal { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.85); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: var(--card-bg); width: 100%; max-width: 400px; padding: 20px; border-radius: 16px; border: 1px solid var(--card-border); }
        .modal-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 12px; }

        /* Chart */
        .chart-bar-container { display: flex; align-items: flex-end; justify-content: space-between; height: 120px; margin-top: 15px; padding-top: 10px; border-bottom: 1px solid var(--card-border); }
        .chart-bar { width: 11%; background: var(--accent-green); border-radius: 4px 4px 0 0; text-align: center; font-size: 0.65rem; color: #000; position: relative; }
        .chart-label { font-size: 0.7rem; color: var(--text-sub); text-align: center; margin-top: 4px; }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1>کالری‌شمار هوشمند</h1>
            <span id="current-date">امروز</span>
        </div>
        <div class="app-icon" title="سیب سبز">🍏</div>
    </header>

    <div class="container">
        <!-- داشبورد -->
        <div id="tab-dashboard" class="tab-content active">
            <div class="card">
                <h3>خلاصه انرژی امروز</h3>
                <div class="summary-grid">
                    <div class="summary-box"><div class="val" id="consumed-cal">0</div><div class="lbl">دریافتی</div></div>
                    <div class="summary-box"><div class="val" id="remaining-cal">0</div><div class="lbl">باقیمانده</div></div>
                    <div class="summary-box"><div class="val burned" id="burned-cal">0</div><div class="lbl">سوخته شده</div></div>
                </div>
            </div>
            <div class="card">
                <h3>مصرف آب امروز</h3>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
                    <span id="water-count" style="font-size:1.1rem; font-weight:bold;">0 از 8 لیوان 💧</span>
                    <div>
                        <button onclick="addWater(1)" style="padding:6px 12px; background:var(--accent-green); border:none; border-radius:6px; font-weight:bold;">+ افزودن</button>
                        <button onclick="addWater(-1)" style="padding:6px 12px; background:var(--card-border); border:none; border-radius:6px; color:#fff;">- کاهش</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- خوراکی‌ها -->
        <div id="tab-foods" class="tab-content">
            <input type="text" id="food-search" class="search-box" placeholder="جستجوی غذا (مرغ، برنج، کباب، نان)..." oninput="renderFoods()">
            <div id="food-list"></div>
        </div>

        <!-- کالری سوزی (ورزش) -->
        <div id="tab-burn" class="tab-content">
            <input type="text" id="workout-search" class="search-box" placeholder="جستجوی ورزش (دویدن، پیاده‌روی، بدنسازی)..." oninput="renderWorkouts()">
            <div id="workout-list"></div>
        </div>

        <!-- آمار -->
        <div id="tab-stats" class="tab-content">
            <div class="card">
                <h3>روند مصرف کالری ۷ روز گذشته</h3>
                <div class="chart-bar-container" id="chart-container"></div>
            </div>
        </div>

        <!-- تنظیمات -->
        <div id="tab-settings" class="tab-content">
            <div class="card">
                <h3>پروفایل کاربری</h3>
                <div class="input-group" style="margin-top:10px;">
                    <label>جنسیت</label>
                    <select id="user-gender"><option value="male">مرد</option><option value="female">زن</option></select>
                </div>
                <div class="input-group">
                    <label>سن (سال)</label>
                    <input type="number" id="user-age" value="25">
                </div>
                <div class="input-group">
                    <label>قد (سانتی‌متر)</label>
                    <input type="number" id="user-height" value="175">
                </div>
                <div class="input-group">
                    <label>وزن (کیلوگرم)</label>
                    <input type="number" id="user-weight" value="70">
                </div>
                <div class="input-group">
                    <label>میزان فعالیت روزانه</label>
                    <select id="user-activity">
                        <option value="1.2">کم (نشسته / بدون ورزش)</option>
                        <option value="1.375">متوسط (۱ تا ۳ جلسه ورزش در هفته)</option>
                        <option value="1.55">زیاد (۳ تا ۵ جلسه ورزش در هفته)</option>
                    </select>
                </div>
                <button class="btn-submit" onclick="saveProfileFromSettings()">بروزرسانی پروفایل</button>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div id="modal-onboarding" class="modal">
        <div class="modal-content">
            <div class="modal-title">خوش آمدید! مشخصات خود را وارد کنید</div>
            <div class="input-group"><label>جنسیت</label><select id="init-gender"><option value="male">مرد</option><option value="female">زن</option></select></div>
            <div class="input-group"><label>سن (سال)</label><input type="number" id="init-age" value="25"></div>
            <div class="input-group"><label>قد (سانتی‌متر)</label><input type="number" id="init-height" value="175"></div>
            <div class="input-group"><label>وزن (کیلوگرم)</label><input type="number" id="init-weight" value="70"></div>
            <div class="input-group">
                <label>میزان فعالیت</label>
                <select id="init-activity">
                    <option value="1.2">کم (نشسته)</option>
                    <option value="1.375">متوسط</option>
                    <option value="1.55">زیاد</option>
                </select>
            </div>
            <button class="btn-submit" onclick="submitOnboarding()">محاسبه کالری و ورود</button>
        </div>
    </div>

    <div id="modal-item" class="modal">
        <div class="modal-content">
            <div class="modal-title" id="modal-item-title">ثبت آیتم</div>
            <div class="input-group">
                <label id="modal-item-unit-label">مقدار (گرم / دقیقه)</label>
                <input type="number" id="modal-item-amount" value="100">
            </div>
            <button class="btn-submit" onclick="confirmAddItem()">ثبت در برنامه امروز</button>
            <button class="btn-submit" style="background:var(--card-border); color:#fff; margin-top:5px;" onclick="closeModal('modal-item')">انصراف</button>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('dashboard', this)"><span class="icon">📊</span>داشبورد</div>
        <div class="nav-item" onclick="switchTab('foods', this)"><span class="icon">🥗</span>خوراکی‌ها</div>
        <div class="nav-item" onclick="switchTab('burn', this)"><span class="icon">🔥</span>کالری‌سوزی</div>
        <div class="nav-item" onclick="switchTab('stats', this)"><span class="icon">📈</span>آمار</div>
        <div class="nav-item" onclick="switchTab('settings', this)"><span class="icon">⚙️</span>تنظیمات</div>
    </nav>

    <script>
        // دیتابیس جامع غذاها
        const foodsDatabase = [
            { id: 1, name: 'زرشک پلو با مرغ', category: 'غذاهای اصلی', calPer100: 195, p: 11, c: 22, f: 6 },
            { id: 2, name: 'چلو کباب کوبیده', category: 'غذاهای اصلی', calPer100: 240, p: 14, c: 18, f: 12 },
            { id: 3, name: 'چلو جوجه کباب', category: 'غذاهای اصلی', calPer100: 180, p: 16, c: 16, f: 5 },
            { id: 4, name: 'خورشت قرمه سبزی با برنج', category: 'غذاهای اصلی', calPer100: 175, p: 6, c: 20, f: 8 },
            { id: 5, name: 'خورشت قیمه با برنج', category: 'غذاهای اصلی', calPer100: 185, p: 7, c: 21, f: 8 },
            { id: 6, name: 'سینه مرغ کباب شده', category: 'پروتئین', calPer100: 165, p: 31, c: 0, f: 3.6 },
            { id: 7, name: 'فیله مرغ پخته', category: 'پروتئین', calPer100: 150, p: 30, c: 0, f: 3 },
            { id: 8, name: 'برنج کته پخته', category: 'غلات', calPer100: 130, p: 2.7, c: 28, f: 0.3 },
            { id: 9, name: 'برنج آبکش پخته', category: 'غلات', calPer100: 120, p: 2.5, c: 26, f: 0.2 },
            { id: 10, name: 'نان لواش', category: 'نان', calPer100: 290, p: 9, c: 58, f: 1.2 },
            { id: 11, name: 'نان سنگک', category: 'نان', calPer100: 259, p: 9, c: 53, f: 1.5 },
            { id: 12, name: 'نان بربری', category: 'نان', calPer100: 265, p: 8.5, c: 54, f: 1.4 },
            { id: 13, name: 'تخم مرغ آب‌پز', category: 'پروتئین', calPer100: 155, p: 12.6, c: 1.1, f: 10.6 },
            { id: 14, name: 'تخم مرغ نیمرو', category: 'پروتئین', calPer100: 196, p: 13.6, c: 0.8, f: 15 },
            { id: 15, name: 'سیب', category: 'میوه', calPer100: 52, p: 0.3, c: 14, f: 0.2 },
            { id: 16, name: 'موز', category: 'میوه', calPer100: 89, p: 1.1, c: 23, f: 0.3 },
            { id: 17, name: 'پرتقال', category: 'میوه', calPer100: 47, p: 0.9, c: 12, f: 0.1 },
            { id: 18, name: 'خیار', category: 'میوه', calPer100: 15, p: 0.7, c: 3.6, f: 0.1 },
            { id: 19, name: 'گوجه فرنگی', category: 'سبزیجات', calPer100: 18, p: 0.9, c: 3.9, f: 0.2 },
            { id: 20, name: 'شیر کم‌چرب', category: 'لبنیات', calPer100: 42, p: 3.4, c: 5, f: 1 },
            { id: 21, name: 'ماست کم‌چرب', category: 'لبنیات', calPer100: 61, p: 3.5, c: 4.7, f: 3.3 },
            { id: 22, name: 'پنیر سفید', category: 'لبنیات', calPer100: 260, p: 14, c: 2, f: 21 },
            { id: 23, name: 'عدسی', category: 'غذاهای سنتی', calPer100: 110, p: 9, c: 20, f: 1 },
            { id: 24, name: 'خورشت فسنجان با برنج', category: 'غذاهای اصلی', calPer100: 230, p: 8, c: 22, f: 14 },
            { id: 25, name: 'ماکارونی با گوشت چرخ‌کرده', category: 'غذاهای اصلی', calPer100: 160, p: 7, c: 25, f: 4 },
            { id: 26, name: 'تن ماهی در روغن', category: 'پروتئین', calPer100: 198, p: 29, c: 0, f: 8 },
            { id: 27, name: 'سیب زمینی سرخ شده', category: 'میان‌وعده', calPer100: 312, p: 3.4, c: 41, f: 15 },
            { id: 28, name: 'سیب زمینی آب‌پز', category: 'میان‌وعده', calPer100: 87, p: 1.9, c: 20, f: 0.1 },
            { id: 29, name: 'خرما', category: 'میان‌وعده', calPer100: 282, p: 2.5, c: 75, f: 0.4 },
            { id: 30, name: 'گردو', category: 'خشکبار', calPer100: 654, p: 15, c: 14, f: 65 }
        ];

        // دیتابیس ورزش‌ها (کالری‌سوزی به ازای هر دقیقه)
        const workoutsDatabase = [
            { id: 101, name: 'دویدن با سرعت متوسط', calPerMin: 10, category: 'هوازی' },
            { id: 102, name: 'پیاده‌روی سریع', calPerMin: 5, category: 'هوازی' },
            { id: 103, name: 'پیاده‌روی معمولی', calPerMin: 3.5, category: 'هوازی' },
            { id: 104, name: 'تمرین با وزنه (بدنسازی)', calPerMin: 6, category: 'قدرتی' },
            { id: 105, name: 'شنا کردن', calPerMin: 8, category: 'هوازی' },
            { id: 106, name: 'دوچرخه‌سواری شهری', calPerMin: 7, category: 'هوازی' },
            { id: 107, name: 'طناب زدن', calPerMin: 11, category: 'هوازی' },
            { id: 108, name: 'فوتبال', calPerMin: 9, category: 'ورزش توپی' }
        ];

        // وضعیت برنامه
        let userState = JSON.parse(localStorage.getItem('cal_user_state')) || null;
        let todayData = JSON.parse(localStorage.getItem('cal_today_data')) || { consumed: 0, burned: 0, water: 0 };
        let selectedItemForAdd = null;
        let isWorkoutMode = false;

        function initApp() {
            if (!userState) {
                document.getElementById('modal-onboarding').style.display = 'flex';
            } else {
                updateProfileInputs();
                calculateTDEE();
                updateDashboard();
            }
            renderFoods();
            renderWorkouts();
            renderChart();
        }

        function calculateTDEE() {
            if (!userState) return 2000;
            const { gender, age, weight, height, activity } = userState;
            let bmr = (10 * weight) + (6.25 * height) - (5 * age) + (gender === 'male' ? 5 : -161);
            let tdee = Math.round(bmr * parseFloat(activity));
            userState.tdee = tdee;
            localStorage.setItem('cal_user_state', JSON.stringify(userState));
            return tdee;
        }

        function submitOnboarding() {
            userState = {
                gender: document.getElementById('init-gender').value,
                age: parseInt(document.getElementById('init-age').value),
                height: parseFloat(document.getElementById('init-height').value),
                weight: parseFloat(document.getElementById('init-weight').value),
                activity: document.getElementById('init-activity').value
            };
            calculateTDEE();
            document.getElementById('modal-onboarding').style.display = 'none';
            updateProfileInputs();
            updateDashboard();
        }

        function updateProfileInputs() {
            if (!userState) return;
            document.getElementById('user-gender').value = userState.gender;
            document.getElementById('user-age').value = userState.age;
            document.getElementById('user-height').value = userState.height;
            document.getElementById('user-weight').value = userState.weight;
            document.getElementById('user-activity').value = userState.activity;
        }

        function saveProfileFromSettings() {
            userState = {
                gender: document.getElementById('user-gender').value,
                age: parseInt(document.getElementById('user-age').value),
                height: parseFloat(document.getElementById('user-height').value),
                weight: parseFloat(document.getElementById('user-weight').value),
                activity: document.getElementById('user-activity').value
            };
            calculateTDEE();
            updateDashboard();
            alert('پروفایل و میزان کالری روزانه بروزرسانی شد.');
        }

        function updateDashboard() {
            const target = userState ? userState.tdee : 2000;
            const remaining = target - todayData.consumed + todayData.burned;
            
            document.getElementById('consumed-cal').innerText = todayData.consumed;
            document.getElementById('burned-cal').innerText = todayData.burned;
            document.getElementById('remaining-cal').innerText = remaining;
            document.getElementById('water-count').innerText = `${todayData.water} از 8 لیوان 💧`;

            localStorage.setItem('cal_today_data', JSON.stringify(todayData));
        }

        function addWater(val) {
            todayData.water = Math.max(0, todayData.water + val);
            updateDashboard();
        }

        function switchTab(tabName, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('tab-' + tabName).classList.add('active');
            el.classList.add('active');
        }

        function renderFoods() {
            const query = document.getElementById('food-search').value.trim().toLowerCase();
            const listEl = document.getElementById('food-list');
            const filtered = foodsDatabase.filter(f => f.name.toLowerCase().includes(query));
            
            if(filtered.length === 0) {
                listEl.innerHTML = '<p style="text-align:center; color: var(--text-sub); padding: 20px;">غذایی یافت نشد</p>';
                return;
            }

            listEl.innerHTML = filtered.map(f => `
                <div class="item-card" onclick="openItemModal(${f.id}, false)">
                    <div class="item-info">
                        <div class="name">${f.name}</div>
                        <div class="details">پروتئین: ${f.p}g | کربو: ${f.c}g | چربی: ${f.f}g (هر ۱۰۰ گرم)</div>
                    </div>
                    <div class="item-value">${f.calPer100} کالری</div>
                </div>
            `).join('');
        }

        function renderWorkouts() {
            const query = document.getElementById('workout-search').value.trim().toLowerCase();
            const listEl = document.getElementById('workout-list');
            const filtered = workoutsDatabase.filter(w => w.name.toLowerCase().includes(query));

            if(filtered.length === 0) {
                listEl.innerHTML = '<p style="text-align:center; color: var(--text-sub); padding: 20px;">ورزشی یافت نشد</p>';
                return;
            }

            listEl.innerHTML = filtered.map(w => `
                <div class="item-card" onclick="openItemModal(${w.id}, true)">
                    <div class="item-info">
                        <div class="name">${w.name}</div>
                        <div class="details">دسته: ${w.category}</div>
                    </div>
                    <div class="item-value burn">${w.calPerMin} کالری/دقیقه</div>
                </div>
            `).join('');
        }

        function openItemModal(id, workout) {
            isWorkoutMode = workout;
            if(workout) {
                selectedItemForAdd = workoutsDatabase.find(w => w.id === id);
                document.getElementById('modal-item-title').innerText = `ثبت فعالیت: ${selectedItemForAdd.name}`;
                document.getElementById('modal-item-unit-label').innerText = 'مدت زمان فعالیت (دقیقه)';
                document.getElementById('modal-item-amount').value = 30;
            } else {
                selectedItemForAdd = foodsDatabase.find(f => f.id === id);
                document.getElementById('modal-item-title').innerText = `ثبت خوراکی: ${selectedItemForAdd.name}`;
                document.getElementById('modal-item-unit-label').innerText = 'مقدار مصرفی (گرم)';
                document.getElementById('modal-item-amount').value = 100;
            }
            document.getElementById('modal-item').style.display = 'flex';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        function confirmAddItem() {
            const amount = parseFloat(document.getElementById('modal-item-amount').value) || 0;
            if(amount <= 0) return;

            if(isWorkoutMode) {
                const burned = Math.round(selectedItemForAdd.calPerMin * amount);
                todayData.burned += burned;
                alert(`${burned} کالری سوزانده شده ثبت شد.`);
            } else {
                const consumed = Math.round((selectedItemForAdd.calPer100 / 100) * amount);
                todayData.consumed += consumed;
                alert(`${consumed} کالری دریافت شده ثبت شد.`);
            }

            updateDashboard();
            closeModal('modal-item');
            switchTab('dashboard', document.querySelectorAll('.nav-item')[0]);
        }

        function renderChart() {
            const container = document.getElementById('chart-container');
            const days = ['شنبه', '۱شنبه', '۲شنبه', '۳شنبه', '۴شنبه', '۵شنبه', 'جمعه'];
            const dummyValues = [1800, 2100, 1950, 2200, 1700, 2050, todayData.consumed || 1900];
            const maxVal = 2500;

            container.innerHTML = days.map((d, idx) => {
                const val = dummyValues[idx];
                const heightPercent = Math.min(100, Math.round((val / maxVal) * 100));
                return `
                    <div style="flex:1; text-align:center;">
                        <div class="chart-bar" style="height: ${heightPercent}%; width: 70%; margin: 0 auto; background: ${idx === 6 ? 'var(--accent-green)' : '#334155'};"></div>
                        <div class="chart-label">${d}</div>
                    </div>
                `;
            }).join('');
        }

        window.onload = initApp;
    </script>
</body>
</html>
