<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>کالری‌شمار هوشمند</title>
    <style>
        :root {
            --bg-color: #121824;
            --card-bg: #1e293b;
            --accent-green: #00e676;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 70px;
        }

        header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #182232;
        }

        .header-title h1 { font-size: 1.1rem; }
        .header-title span { font-size: 0.8rem; color: var(--text-sub); }
        .app-icon { width: 35px; height: 35px; background: var(--accent-green); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }

        .container { padding: 15px; }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }

        .summary-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; text-align: center; margin-top: 10px; }
        .summary-box { background: #0f172a; padding: 10px; border-radius: 12px; }
        .summary-box .val { font-size: 1.1rem; font-weight: bold; color: var(--accent-green); }
        .summary-box .lbl { font-size: 0.75rem; color: var(--text-sub); margin-top: 4px; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 60px;
            background: #182232;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid var(--border-color);
        }

        .nav-item { text-align: center; color: var(--text-sub); font-size: 0.75rem; cursor: pointer; }
        .nav-item.active { color: var(--accent-green); }
        .nav-item .icon { font-size: 1.2rem; display: block; }

        /* Search & Food List */
        .search-box {
            width: 100%; padding: 12px; background: #0f172a; border: 1px solid var(--border-color);
            border-radius: 10px; color: #fff; margin-bottom: 12px; font-size: 0.9rem;
        }

        .food-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px; background: #0f172a; border-radius: 12px; margin-bottom: 8px;
        }
        .food-info .name { font-weight: bold; font-size: 0.95rem; }
        .food-info .details { font-size: 0.75rem; color: var(--text-sub); margin-top: 2px; }
        .food-cal { color: var(--accent-green); font-weight: bold; font-size: 0.9rem; }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1>کالری‌شمار هوشمند</h1>
            <span id="current-date">امروز</span>
        </div>
        <div class="app-icon">🍎</div>
    </header>

    <div class="container">
        <!-- داشبورد -->
        <div id="tab-dashboard" class="tab-content active">
            <div class="card">
                <h3>خلاصه انرژی امروز</h3>
                <div class="summary-grid">
                    <div class="summary-box"><div class="val" id="consumed-cal">0</div><div class="lbl">دریافتی</div></div>
                    <div class="summary-box"><div class="val" id="remaining-cal">2000</div><div class="lbl">باقیمانده</div></div>
                    <div class="summary-box"><div class="val" id="burned-cal">0</div><div class="lbl">سوخته شده</div></div>
                </div>
            </div>
            <div class="card">
                <h3>میزان مصرف آب</h3>
                <p style="margin-top: 10px; color: var(--text-sub);">0 از 8 لیوان</p>
            </div>
        </div>

        <!-- خوراکی‌ها -->
        <div id="tab-foods" class="tab-content">
            <input type="text" id="food-search" class="search-box" placeholder="جستجوی غذا (مثلا: موز، سیب، برنج)..." oninput="renderFoods()">
            <div id="food-list"></div>
        </div>

        <!-- کالری سوزی -->
        <div id="tab-burn" class="tab-content">
            <div class="card">
                <h3>ثبت فعالیت و ورزشی</h3>
                <p style="color: var(--text-sub); font-size: 0.85rem; margin-top: 5px;">ورزش‌های روزانه خود را برای محاسبه دقیق ثبت کنید.</p>
            </div>
        </div>

        <!-- آمار -->
        <div id="tab-stats" class="tab-content">
            <div class="card">
                <h3>روند مصرف کالری ۷ روز گذشته</h3>
            </div>
        </div>

        <!-- تنظیمات -->
        <div id="tab-settings" class="tab-content">
            <div class="card">
                <h3>اطلاعات شخصی و تنظیمی</h3>
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('dashboard', this)"><span class="icon">📊</span>داشبورد</div>
        <div class="nav-item" onclick="switchTab('foods', this)"><span class="icon">🥗</span>خوراکی‌ها</div>
        <div class="nav-item" onclick="switchTab('burn', this)"><span class="icon">🔥</span>کالری‌سوزی</div>
        <div class="nav-item" onclick="switchTab('stats', this)"><span class="icon">📈</span>آمار</div>
        <div class="nav-item" onclick="switchTab('settings', this)"><span class="icon">⚙️</span>تنظیمات</div>
    </nav>

    <!-- بارگذاری دیتابیس ۲۰ هزار غذا -->
    <script src="foods.js"></script>
    <script>
        function switchTab(tabName, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('tab-' + tabName).classList.add('active');
            el.classList.add('active');
            if(tabName === 'foods') renderFoods();
        }

        function renderFoods() {
            const query = document.getElementById('food-search').value.trim().toLowerCase();
            const listEl = document.getElementById('food-list');
            const foods = window.FOODS_DATABASE || [];
            
            const filtered = foods.filter(f => f.name.toLowerCase().includes(query)).slice(0, 30);
            
            if(filtered.length === 0) {
                listEl.innerHTML = '<p style="text-align:center; color: var(--text-sub); padding: 20px;">غذایی یافت نشد</p>';
                return;
            }

            listEl.innerHTML = filtered.map(f => `
                <div class="food-item">
                    <div class="food-info">
                        <div class="name">${f.name}</div>
                        <div class="details">پروتئین: ${f.protein}g | کربو: ${f.carbs}g | چربی: ${f.fat}g</div>
                    </div>
                    <div class="food-cal">${f.calories} کالری</div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
