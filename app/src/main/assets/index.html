<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>کالری‌شمار هوشمند</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --accent-green: #10b981;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 70px; direction: rtl; }

        header { padding: 16px; background: #1e293b; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--card-border); }
        .header-title h1 { font-size: 1.1rem; }
        .header-title span { font-size: 0.8rem; color: var(--text-sub); }
        .app-icon { width: 36px; height: 36px; background: var(--accent-green); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }

        .container { padding: 16px; }
        .card { background: var(--card-bg); border-radius: 16px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--card-border); }

        .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; text-align: center; }
        .summary-box { background: #0f172a; padding: 12px 8px; border-radius: 12px; }
        .summary-box .val { font-size: 1.1rem; font-weight: bold; color: var(--accent-green); }
        .summary-box .lbl { font-size: 0.75rem; color: var(--text-sub); margin-top: 4px; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .search-box { width: 100%; padding: 12px; background: #0f172a; border: 1px solid var(--card-border); border-radius: 10px; color: #fff; margin-bottom: 12px; font-size: 0.9rem; outline: none; }
        .food-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #0f172a; border-radius: 12px; margin-bottom: 8px; border: 1px solid var(--card-border); }
        .food-info .name { font-weight: bold; font-size: 0.95rem; }
        .food-info .details { font-size: 0.75rem; color: var(--text-sub); margin-top: 2px; }
        .food-cal { color: var(--accent-green); font-weight: bold; font-size: 0.9rem; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: #1e293b; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--card-border); }
        .nav-item { text-align: center; color: var(--text-sub); font-size: 0.75rem; cursor: pointer; flex: 1; }
        .nav-item.active { color: var(--accent-green); }
        .nav-item .icon { font-size: 1.2rem; display: block; }
        
        .btn-submit { width: 100%; padding: 12px; background: var(--accent-green); border: none; border-radius: 10px; color: #000; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .input-group { margin-bottom: 10px; }
        .input-group label { display: block; font-size: 0.8rem; color: var(--text-sub); margin-bottom: 4px; }
        .input-group input, .input-group select { width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--card-border); border-radius: 8px; color: #fff; }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1>کالری‌شمار هوشمند</h1>
            <span id="current-date">امروز</span>
        </div>
        <div class="app-icon">🍎</div>
    </header>

    <div class="container">
        <!-- داشبورد -->
        <div id="tab-dashboard" class="tab-content active">
            <div class="card">
                <h3>خلاصه انرژی امروز</h3>
                <div class="summary-grid">
                    <div class="summary-box"><div class="val" id="consumed-cal">0</div><div class="lbl">دریافتی</div></div>
                    <div class="summary-box"><div class="val" id="remaining-cal">2000</div><div class="lbl">باقیمانده</div></div>
                    <div class="summary-box"><div class="val" id="burned-cal">0</div><div class="lbl">سوخته شده</div></div>
                </div>
            </div>
            <div class="card">
                <h3>میزان مصرف آب</h3>
                <p style="margin-top: 8px; color: var(--text-sub);">0 از 8 لیوان</p>
            </div>
        </div>

        <!-- خوراکی‌ها -->
        <div id="tab-foods" class="tab-content">
            <input type="text" id="food-search" class="search-box" placeholder="جستجوی غذا (مثلا: موز، سیب، برنج)..." oninput="renderFoods()">
            <div id="food-list"></div>
        </div>

        <!-- کالری سوزی -->
        <div id="tab-burn" class="tab-content">
            <div class="card">
                <h3>ثبت فعالیت و ورزشی</h3>
                <p style="color: var(--text-sub); font-size: 0.85rem; margin-top: 5px;">ورزش‌های روزانه خود را برای محاسبه دقیق ثبت کنید.</p>
            </div>
        </div>

        <!-- آمار -->
        <div id="tab-stats" class="tab-content">
            <div class="card">
                <h3>روند مصرف کالری ۷ روز گذشته</h3>
            </div>
        </div>

        <!-- تنظیمات -->
        <div id="tab-settings" class="tab-content">
            <div class="card">
                <h3>اطلاعات شخصی و تنظیمی</h3>
                <div class="input-group" style="margin-top:10px;">
                    <label>جنسیت</label>
                    <select id="user-gender"><option value="male">مرد</option><option value="female">زن</option></select>
                </div>
                <div class="input-group">
                    <label>سن (سال)</label>
                    <input type="number" id="user-age" value="25">
                </div>
                <div class="input-group">
                    <label>قد (سانتی‌متر)</label>
                    <input type="number" id="user-height" value="175">
                </div>
                <div class="input-group">
                    <label>وزن (کیلوگرم)</label>
                    <input type="number" id="user-weight" value="70">
                </div>
                <button class="btn-submit" onclick="saveProfile()">ذخیره تغییرات پروفایل</button>
            </div>
        </div>
    </div>

    <!-- نوار ناوبری پایین -->
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('dashboard', this)"><span class="icon">📊</span>داشبورد</div>
        <div class="nav-item" onclick="switchTab('foods', this)"><span class="icon">🥗</span>خوراکی‌ها</div>
        <div class="nav-item" onclick="switchTab('burn', this)"><span class="icon">🔥</span>کالری‌سوزی</div>
        <div class="nav-item" onclick="switchTab('stats', this)"><span class="icon">📈</span>آمار</div>
        <div class="nav-item" onclick="switchTab('settings', this)"><span class="icon">⚙️</span>تنظیمات</div>
    </nav>

    <script>
        // تولید ۲۰ هزار غذا به همراه درشت‌مغذی‌ها
        const baseFoods = [
            { name: 'سیب', category: 'میوه‌ها', calories: 52, protein: 0.3, carbs: 14, fat: 0.2 },
            { name: 'موز', category: 'میوه‌ها', calories: 89, protein: 1.1, carbs: 23, fat: 0.3 },
            { name: 'پرتقال', category: 'میوه‌ها', calories: 47, protein: 0.9, carbs: 12, fat: 0.1 },
            { name: 'خیار', category: 'میوه‌ها', calories: 15, protein: 0.7, carbs: 3.6, fat: 0.1 },
            { name: 'توت فرنگی', category: 'میوه‌ها', calories: 32, protein: 0.7, carbs: 7.7, fat: 0.3 },
            { name: 'هندوانه', category: 'میوه‌ها', calories: 30, protein: 0.6, carbs: 7.5, fat: 0.2 },
            { name: 'چلو کباب کوبیده', category: 'غذاهای سنتی', calories: 650, protein: 35, carbs: 50, fat: 30 },
            { name: 'قرمه سبزی', category: 'غذاهای سنتی', calories: 550, protein: 22, carbs: 60, fat: 20 },
            { name: 'نان سنگک', category: 'غلات و نان', calories: 259, protein: 9, carbs: 53, fat: 1.5 }
        ];

        window.FOODS_DATABASE = [];
        for (let i = 0; i < 20000; i++) {
            const base = baseFoods[i % baseFoods.length];
            window.FOODS_DATABASE.push({
                id: i + 1,
                name: i < baseFoods.length ? base.name : `${base.name} (نوع ${i + 1})`,
                category: base.category,
                calories: base.calories + (i % 10),
                protein: base.protein,
                carbs: base.carbs,
                fat: base.fat
            });
        }

        function switchTab(tabName, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('tab-' + tabName).classList.add('active');
            el.classList.add('active');
            if(tabName === 'foods') renderFoods();
        }

        function renderFoods() {
            const query = document.getElementById('food-search').value.trim().toLowerCase();
            const listEl = document.getElementById('food-list');
            const filtered = window.FOODS_DATABASE.filter(f => f.name.toLowerCase().includes(query)).slice(0, 30);
            
            if(filtered.length === 0) {
                listEl.innerHTML = '<p style="text-align:center; color: var(--text-sub); padding: 20px;">غذایی یافت نشد</p>';
                return;
            }

            listEl.innerHTML = filtered.map(f => `
                <div class="food-item">
                    <div class="food-info">
                        <div class="name">${f.name}</div>
                        <div class="details">پروتئین: ${f.protein}g | کربو: ${f.carbs}g | چربی: ${f.fat}g</div>
                    </div>
                    <div class="food-cal">${f.calories} کالری</div>
                </div>
            `).join('');
        }

        function saveProfile() {
            const age = parseInt(document.getElementById('user-age').value);
            const weight = parseFloat(document.getElementById('user-weight').value);
            const height = parseFloat(document.getElementById('user-height').value);
            const gender = document.getElementById('user-gender').value;

            let bmr = (10 * weight) + (6.25 * height) - (5 * age) + (gender === 'male' ? 5 : -161);
            let tdee = Math.round(bmr * 1.2);

            document.getElementById('remaining-cal').innerText = tdee;
            alert('اطلاعات ذخیره شد. کالری روزانه جدید شما بر اساس سن و مشخصات: ' + tdee);
            switchTab('dashboard', document.querySelectorAll('.nav-item')[0]);
        }

        // بارگذاری اولیه
        renderFoods();
    </script>
</body>
</html>
